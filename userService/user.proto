syntax = "proto3";

package userService;

service UserService {
    rpc GetUser (GetUserRequest) returns (GetUserResponse);
}

message GetUserRequest {
    int32 user_id = 1;
}

message User {
  int32 user_id = 1;
  string name = 2;
  string email = 3;
}

message Order {
    int32 order_id = 1;
    int32 user_id = 2;
    string product_name = 3;
    int32 quantity = 4;
    double total_amount = 5;
}

message GetUserResponse {
    User user = 1;
    repeated Order orders = 2;
}
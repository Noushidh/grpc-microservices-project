apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-deployment

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: noushidh/grpc-order-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5002

          env:
            - name: PORT
              value: "5002"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: JWT_SECRET

            - name: JWT_EXPIRES_IN
              value: "24h"

            - name: USER_SERVICE_URL
              value: "user-service:50051"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: DATABASE_URL